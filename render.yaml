services:
  # 1. ProductGuard AI - Streamlit Interactive Dashboard
  - type: web
    name: productguard-ai-dashboard
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py dashboard
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PORT
        value: 10000

  # 2. ProductGuard AI - FastAPI Backend (Optional / Secondary Web Service)
  - type: web
    name: productguard-ai-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py api
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PORT
        value: 10000
